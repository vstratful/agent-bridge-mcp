name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm (version from packageManager)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
      - name: Verify packaged CLI
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          # tar fails when the named member is absent; piping into grep -q would
          # SIGPIPE tar under the runner's pipefail.
          tar -tzf "$RUNNER_TEMP"/agent-bridge-mcp-*.tgz package/dist/cli.js >/dev/null \
            || { echo 'Package is missing dist/cli.js'; exit 1; }

  readme-install:
    name: Install from git the way the README does (npm ${{ matrix.npm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        npm: [bundled, '12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Use npm ${{ matrix.npm }}
        if: matrix.npm != 'bundled'
        run: npm install -g npm@${{ matrix.npm }}
      - name: Pack from git and install globally
        shell: bash
        run: |
          npm --version
          cd "$RUNNER_TEMP"
          npm pack --allow-git=all "git+file://$GITHUB_WORKSPACE#$GITHUB_SHA"
          npm install -g --ignore-scripts ./agent-bridge-mcp-*.tgz --prefix "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/agent-bridge-mcp" --help
